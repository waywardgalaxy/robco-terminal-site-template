<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RobCo Terminal Site</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="crt-screen" aria-label="Full-window glowing CRT screen">
      <section class="terminal" aria-label="Terminal link display">
        <div class="terminal-output" id="terminalOutput" aria-live="polite"></div>
      </section>
      <div class="screen-glow"></div>
      <div class="glass-sheen"></div>
      <div class="electron-sweep"></div>
      <div class="scanlines"></div>
      <div class="screen-vignette"></div>
      <div class="boot-shutter"></div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
